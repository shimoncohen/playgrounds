name: CI

# Runs on pull requests, and is called by the Pages workflow so nothing deploys unless it passes.
# A pull request runs only the tests for the parts it changes (tools/ci-plan.mjs); the Pages run tests everything.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # Depth 2: a pull request checks out its merge commit, whose first parent is the base branch.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Playgrounds bundle for the Artifact tool
        run: python3 tools/build.py --check

      - name: JavaScript syntax
        run: |
          for f in */app.js programming/*/app.js math/*.js math/scene/*.js math/input/*.js math/*/app.js math/*/content.js programming/ds-quest/*.js programming/shell-quest/*.js programming/shell-quest/engine/*.js programming/shell-quest/content/*.js shared/*.js tests/*.mjs tests/shell/*.mjs tests/ds/*.mjs programming/net-quest/*.js programming/net-quest/engine/*.js programming/net-quest/content/*.js tests/net/*.mjs tests/python/*.mjs tests/script/*.mjs tests/cpp/*.mjs tests/harbor/*.mjs tests/math/*.mjs tests/fixtures/*.js programming/agent-quest/*.js programming/agent-quest/engine/*.js programming/agent-quest/content/*.js tests/agent/*.mjs; do
            node --check "$f" || exit 1
          done

      - name: Pick the test jobs
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify HEAD^2 >/dev/null; then
            git diff --name-only HEAD^1 HEAD | node tools/ci-plan.mjs
          else
            node tools/ci-plan.mjs --all
          fi

  test:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1

      # The smoke tests run tools/build.py.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Chromium
        if: matrix.browser
        run: npx playwright install --with-deps chromium

      - name: Run
        env:
          TASK: ${{ toJSON(matrix) }}
        run: node tools/ci-plan.mjs run

  # The required status check: one name however many test jobs ran, and green when none were needed.
  checks:
    needs: [plan, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All jobs passed or were not needed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
