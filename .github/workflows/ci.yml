name: CI

# Runs on pull requests, and is called by the Pages workflow so nothing deploys unless it passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Playgrounds bundle for the Artifact tool
        run: python3 tools/build.py --check

      - name: JavaScript syntax
        run: |
          for f in */app.js shared/*.js tests/*.mjs; do
            node --check "$f" || exit 1
          done

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm test
