name: CI

# Runs on pull requests, and is called by the Pages workflow so nothing deploys unless it passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Playgrounds bundle for the Artifact tool
        run: python3 tools/build.py --check

      - name: JavaScript syntax
        run: |
          for f in */app.js shell-quest/*.js shell-quest/engine/*.js shell-quest/content/*.js shared/*.js tests/*.mjs tests/shell/*.mjs; do
            node --check "$f" || exit 1
          done

      - run: npm ci

      - name: Shell Quest engine tests
        run: npm run test:engine

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The engine tests already ran above; `npm test` would run them a second time.
      - name: Browser smoke and golden tests
        run: node tests/smoke.mjs && node tests/shell-golden.mjs
