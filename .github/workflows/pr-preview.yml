name: PR preview

# Pull requests that change anything visual get a live copy of the site at
#   https://<owner>.github.io/<repo>/pr-preview/pr-<number>/
# so the change can be looked at (and Pages problems show up) before merging.
# The copy is removed when the PR is closed.
#
# Only pull requests from this repository are previewed: forks get a read-only token,
# and a preview runs the PR's own JavaScript on the site's origin.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - 'index.html'
      - 'shared/**'
      - '*-quest/**'
      - 'tools/publish_site.sh'
      - '.github/workflows/pr-preview.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the PR
        if: github.event.action != 'closed'
        uses: actions/checkout@v7.0.1

      # A closed PR may have no merge ref left to check out; the script comes from the default branch.
      - name: Check out the default branch
        if: github.event.action == 'closed'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Publish the preview
        if: github.event.action != 'closed'
        run: tools/publish_site.sh pr "$PR"

      - name: Remove the preview
        if: github.event.action == 'closed'
        run: tools/publish_site.sh remove-pr "$PR"

      - name: Comment with the link
        if: github.event.action != 'closed'
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/pr-preview/pr-${PR}/"
          gh pr comment "$PR" --edit-last --create-if-none --body "**Preview:** ${url}

          Updated for \`${HEAD_SHA::7}\`. GitHub Pages can take a minute to publish a new version. Previews share the site's origin, so they read and write the same saved progress as the live site: use a private window to test without touching your own.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"

      - name: Update the comment
        if: github.event.action == 'closed'
        run: gh pr comment "$PR" --edit-last --body "Preview removed." || true
