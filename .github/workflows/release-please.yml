name: Release

# release-please keeps one "chore(release): X.Y.Z" pull request open on main. It bumps package.json and writes
# CHANGELOG.md from the Conventional Commits since the last release. Merging that PR tags the commit and publishes
# the GitHub Release. Nobody pushes to main directly, so branch protection stays on.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4.2.0
        with:
          # RELEASE_TOKEN (a PAT or app token) makes the required checks run on the release PR;
          # PRs opened with GITHUB_TOKEN do not trigger workflows.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
