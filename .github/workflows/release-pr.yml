name: Release PR

# Manual: Actions -> Release PR -> Run workflow.
# main is protected, so this never pushes to main. It computes the next version from the Conventional
# Commits since the last tag, then opens a "chore(release): X.Y.Z" pull request that bumps package.json
# and writes CHANGELOG.md. Merge that PR; release-tag.yml then tags main and publishes the GitHub Release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major, first-release]
        default: auto

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # RELEASE_TOKEN (a PAT or app token) makes CI run on the PR; GITHUB_TOKEN-created PRs do not trigger workflows.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Bump version and write changelog
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          args=(--skip.commit --skip.tag)
          case "$BUMP" in
            auto) ;;
            first-release) args+=(--first-release) ;;
            patch|minor|major) args+=(--release-as "$BUMP") ;;
          esac
          npx commit-and-tag-version "${args[@]}"
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists; nothing to release."; exit 1
          fi
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git push --force-with-lease origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(release): $VERSION" \
            --body "Release $VERSION. Generated from Conventional Commits since the last tag. Review \`CHANGELOG.md\`, then squash-merge; the tag and GitHub Release are created automatically after the merge."
