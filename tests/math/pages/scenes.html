<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math Quest scene test page</title>
<link rel="stylesheet" href="../../../math-quest/style.css">
<link rel="stylesheet" href="../../../math-quest/vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../../math-quest/scene/scene.css">
</head>
<body>
<div class="wrap">
  <h1>Scene test page</h1>
  <h2>2D</h2>
  <div id="s2d"></div>
  <h2>3D</h2>
  <div id="s3d"></div>
</div>
<script src="../../../math-quest/vendor/katex/katex.min.js"></script>
<script src="../../../math-quest/vendor/three/three.min.js"></script>
<script src="../../../math-quest/scene/palette.js"></script>
<script src="../../../math-quest/scene/model.js"></script>
<script src="../../../math-quest/scene/svg2d.js"></script>
<script src="../../../math-quest/scene/three3d.js"></script>
<script src="../../../math-quest/scene/view.js"></script>
<script>
const theme = new URLSearchParams(location.search).get('theme');
if (theme) document.documentElement.dataset.theme = theme;

const line = {
  id: 'line', title: 'Graph of y = mx + c',
  params: {
    m: { min: -3, max: 3, step: 0.5, value: 1, label: 'slope m' },
    c: { min: -3, max: 3, step: 1, value: 1, label: 'height c' },
    x0: { min: -4, max: 4, step: 1, value: 2, label: 'point x' },
  },
  t: { min: 0, max: 6.28, step: 0.01, value: 0, speed: 1, label: 'turn' },
  derived: p => ({ y0: p.m * p.x0 + p.c }),
  formula: 'y = \\term{m}{m}x + \\term{c}{c}',
  live: 'y({x0}) = {m}·{x0} + {c} = {y0}',
  draw: {
    kind: '2d', view: [-5, 5, -5, 5],
    items: s => [
      { type: 'axes' },
      { type: 'fn', f: x => s.params.m * x + s.params.c, term: 'm' },
      { type: 'fn', f: x => 1 / x },
      { type: 'vector', from: [0, 0], to: [3 * Math.cos(s.t), 3 * Math.sin(s.t)], term: 'c' },
      { type: 'point', x: s.params.x0, y: s.derived.y0, term: 'x0', drag: { x: 'x0' }, label: 'point on the line' },
    ],
  },
};

const box = {
  id: 'box-volume', title: 'Box volume',
  params: {
    a: { min: 1, max: 6, step: 1, value: 2, label: 'length' },
    b: { min: 1, max: 6, step: 1, value: 3, label: 'width' },
    c: { min: 1, max: 6, step: 1, value: 4, label: 'height' },
  },
  derived: p => ({ V: p.a * p.b * p.c }),
  formula: 'V = \\term{a}{a}\\cdot\\term{b}{b}\\cdot\\term{c}{c}',
  live: 'V = {a}·{b}·{c} = {V}',
  draw: { kind: '3d', shape: 'box', size: p => [p.a, p.b, p.c] },
};

window.scenes = {
  s2d: MQ.scene.mount(document.getElementById('s2d'), line),
  s3d: MQ.scene.mount(document.getElementById('s3d'), box),
};
</script>
</body>
</html>
